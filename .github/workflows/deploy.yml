name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          verify_page() {
            local path="$1" marker="$2"
            for attempt in {1..8}; do
              if curl --fail --silent --show-error --max-time 15 "${PAGE_URL%/}/$path" -o "$RUNNER_TEMP/pages-response.html" &&
                grep -Fq "$marker" "$RUNNER_TEMP/pages-response.html"; then
                return 0
              fi
              sleep 10
            done
            echo "::error::Published page verification failed for $path"
            return 1
          }
          verify_page 'projects/embedded-linux-peripheral-control/' 'id="peripheral-control-project"'
          verify_page 'edit/' 'id="editor-form"'
